name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python 3.11)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: energiq
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: energiq_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U energiq -d energiq_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu   # CPU build is enough for the LSTM tests
      - name: Lint
        run: ruff check .
      - name: Unit and integration tests with coverage (SQLite)
        run: pytest tests/unit tests/integration -q --cov=backend --cov=ml_engine --cov-report=term-missing:skip-covered
      - name: Integration and security tests (PostgreSQL 16)
        env:
          ENERGIQ_TEST_DATABASE_URL: postgresql+psycopg://energiq:ci-only-password@localhost:5432/energiq_test
        run: pytest tests/integration -q
      - name: Static security scan (bandit, medium+ severity)
        run: bandit -r backend ml_engine -ll -q
      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.txt

  frontend:
    name: Frontend (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Dependency vulnerability audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: End-to-end (real server + real browser)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          python -m playwright install --with-deps chromium
      - name: Build the frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: HTTP workflow and browser workflow
        run: pytest tests/e2e -q -rs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: docs/screenshots/e2e
          if-no-files-found: ignore

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        env:
          POSTGRES_PASSWORD: ci-only-password
          ENERGIQ_SECRET_KEY: ci-only-secret-key-that-is-long-enough-0123456789
        run: docker compose config -q
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend.Dockerfile
          push: false
          tags: energiq-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/frontend.Dockerfile
          push: false
          tags: energiq-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      - name: Smoke test - API image migrates a fresh database and answers health checks
        run: |
          docker run -d --name api --network host \
            -e ENERGIQ_ENV=prod -e ENERGIQ_SECRET_KEY=ci-only-secret-key-that-is-long-enough-0123456789 \
            -e ENERGIQ_DATABASE_URL=sqlite:////data/ci.db energiq-api:ci
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:8000/health/ready && break; sleep 2; done
          curl -fsS http://127.0.0.1:8000/health/ready | grep '"status":"ok"'
          docker logs api | tail -20

  infrastructure:
    name: CloudFormation lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install cfn-lint
      - run: cfn-lint infrastructure/aws/*.yaml
