AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  EnergiQ AI application stack (step 2 of 2): VPC, ALB, ECS Fargate (API + web), RDS PostgreSQL, EFS, Secrets Manager,
  CloudWatch logs and alarms. NOT deployed by this project - configuration only. Creating it incurs AWS charges
  (ALB, Fargate, RDS, EFS); estimate with the AWS Pricing Calculator before use.

Parameters:
  ProjectName:
    Type: String
    Default: energiq
    AllowedPattern: "^[a-z][a-z0-9-]{1,20}$"
  BackendImage:
    Type: String
    Description: Full image URI of the API image, including an immutable tag (from ecr.yaml).
  WebImage:
    Type: String
    Description: Full image URI of the web image, including an immutable tag (from ecr.yaml).
  CertificateArn:
    Type: String
    Default: ""
    Description: >-
      ACM certificate ARN in this region. If empty the load balancer serves plain HTTP, which sends passwords
      unencrypted - acceptable ONLY for a short evaluation, never for real users.
  AllowedIngressCidr:
    Type: String
    Default: 0.0.0.0/0
    AllowedPattern: "^(\\d{1,3}\\.){3}\\d{1,3}/\\d{1,2}$"
    Description: Who may reach the load balancer. Restrict this to your own address range while evaluating.
  VpcCidr:
    Type: String
    Default: 10.20.0.0/16
  DbInstanceClass:
    Type: String
    Default: db.t4g.micro
  DbAllocatedStorageGb:
    Type: Number
    Default: 20
    MinValue: 20
    MaxValue: 1000
  DbMultiAz:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
  DbDeletionProtection:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
  AdminEmail:
    Type: String
    Default: ""
    Description: Optional e-mail for a bootstrap administrator. Its generated password is stored in Secrets Manager.
  AlarmEmail:
    Type: String
    Default: ""
    Description: Optional e-mail address subscribed to the alarm topic (the subscription must be confirmed).
  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues: [7, 14, 30, 60, 90, 180, 365]

Conditions:
  HasCertificate: !Not [!Equals [!Ref CertificateArn, ""]]
  NoCertificate: !Equals [!Ref CertificateArn, ""]
  HasAdminEmail: !Not [!Equals [!Ref AdminEmail, ""]]
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, ""]]

Resources:
  # ------------------------------------------------------------------ network
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{Key: Name, Value: !Sub "${ProjectName}-vpc"}]

  InternetGateway:
    Type: AWS::EC2::InternetGateway
  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties: {VpcId: !Ref Vpc, InternetGatewayId: !Ref InternetGateway}

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [0, !Cidr [!Ref VpcCidr, 4, 12]]
      MapPublicIpOnLaunch: false
      Tags: [{Key: Name, Value: !Sub "${ProjectName}-public-a"}]
  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Select [1, !Cidr [!Ref VpcCidr, 4, 12]]
      MapPublicIpOnLaunch: false
      Tags: [{Key: Name, Value: !Sub "${ProjectName}-public-b"}]
  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [2, !Cidr [!Ref VpcCidr, 4, 12]]
      Tags: [{Key: Name, Value: !Sub "${ProjectName}-private-a"}]
  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Select [3, !Cidr [!Ref VpcCidr, 4, 12]]
      Tags: [{Key: Name, Value: !Sub "${ProjectName}-private-b"}]

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties: {VpcId: !Ref Vpc}
  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties: {RouteTableId: !Ref PublicRouteTable, DestinationCidrBlock: 0.0.0.0/0, GatewayId: !Ref InternetGateway}
  PublicSubnetARoute:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PublicSubnetA, RouteTableId: !Ref PublicRouteTable}
  PublicSubnetBRoute:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PublicSubnetB, RouteTableId: !Ref PublicRouteTable}
  # Private subnets have no route to the internet: the database and file system never need it.
  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties: {VpcId: !Ref Vpc}
  PrivateSubnetARoute:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PrivateSubnetA, RouteTableId: !Ref PrivateRouteTable}
  PrivateSubnetBRoute:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PrivateSubnetB, RouteTableId: !Ref PrivateRouteTable}

  # ------------------------------------------------------------------ security groups (least privilege chain)
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Load balancer - public web traffic
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: !Ref AllowedIngressCidr, Description: HTTP}
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: !Ref AllowedIngressCidr, Description: HTTPS}
  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Web tasks - only from the load balancer
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 8080, ToPort: 8080, SourceSecurityGroupId: !Ref AlbSecurityGroup, Description: From ALB}
  ApiSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: API tasks - only from the load balancer
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 8000, ToPort: 8000, SourceSecurityGroupId: !Ref AlbSecurityGroup, Description: From ALB}
  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PostgreSQL - only from API tasks
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 5432, ToPort: 5432, SourceSecurityGroupId: !Ref ApiSecurityGroup, Description: From API}
  EfsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: EFS - only from API tasks
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 2049, ToPort: 2049, SourceSecurityGroupId: !Ref ApiSecurityGroup, Description: NFS from API}

  # ------------------------------------------------------------------ secrets
  AppSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: JWT signing key for the EnergiQ API
      GenerateSecretString:
        SecretStringTemplate: "{}"
        GenerateStringKey: secret_key
        PasswordLength: 64
        ExcludePunctuation: true
  AdminSecret:
    Type: AWS::SecretsManager::Secret
    Condition: HasAdminEmail
    Properties:
      Description: Bootstrap administrator password (change it after the first login)
      GenerateSecretString:
        SecretStringTemplate: "{}"
        GenerateStringKey: password
        PasswordLength: 24
        ExcludePunctuation: true

  # ------------------------------------------------------------------ database
  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: EnergiQ private subnets
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: postgres
      EngineVersion: "16.11"
      DBInstanceClass: !Ref DbInstanceClass
      AllocatedStorage: !Ref DbAllocatedStorageGb
      StorageType: gp3
      StorageEncrypted: true
      DBName: energiq
      MasterUsername: energiq
      ManageMasterUserPassword: true # RDS creates and rotates the password secret; it never appears in this template
      MultiAZ: !Ref DbMultiAz
      PubliclyAccessible: false
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups: [!Ref DbSecurityGroup]
      BackupRetentionPeriod: 7
      DeletionProtection: !Ref DbDeletionProtection
      EnablePerformanceInsights: false
      CopyTagsToSnapshot: true

  # ------------------------------------------------------------------ persistent files (uploads + trained models)
  FileSystem:
    Type: AWS::EFS::FileSystem
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Encrypted: true
      PerformanceMode: generalPurpose
      BackupPolicy: {Status: ENABLED}
  MountTargetA:
    Type: AWS::EFS::MountTarget
    Properties: {FileSystemId: !Ref FileSystem, SubnetId: !Ref PrivateSubnetA, SecurityGroups: [!Ref EfsSecurityGroup]}
  MountTargetB:
    Type: AWS::EFS::MountTarget
    Properties: {FileSystemId: !Ref FileSystem, SubnetId: !Ref PrivateSubnetB, SecurityGroups: [!Ref EfsSecurityGroup]}
  AccessPoint:
    Type: AWS::EFS::AccessPoint
    Properties:
      FileSystemId: !Ref FileSystem
      PosixUser: {Uid: "10001", Gid: "10001"}
      RootDirectory:
        Path: /energiq
        CreationInfo: {OwnerUid: "10001", OwnerGid: "10001", Permissions: "750"}

  # ------------------------------------------------------------------ load balancer
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      Scheme: internet-facing
      Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
      SecurityGroups: [!Ref AlbSecurityGroup]
      LoadBalancerAttributes:
        - {Key: idle_timeout.timeout_seconds, Value: "300"}
        - {Key: routing.http.drop_invalid_header_fields.enabled, Value: "true"}
        - {Key: deletion_protection.enabled, Value: "false"}
  WebTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref Vpc
      Protocol: HTTP
      Port: 8080
      TargetType: ip
      HealthCheckPath: /nginx-health
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      TargetGroupAttributes: [{Key: deregistration_delay.timeout_seconds, Value: "30"}]
  ApiTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref Vpc
      Protocol: HTTP
      Port: 8000
      TargetType: ip
      HealthCheckPath: /health/ready
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher: {HttpCode: "200"}
      TargetGroupAttributes: [{Key: deregistration_delay.timeout_seconds, Value: "30"}]
  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - !If
          - HasCertificate
          - Type: redirect
            RedirectConfig: {Protocol: HTTPS, Port: "443", StatusCode: HTTP_301}
          - Type: forward
            TargetGroupArn: !Ref WebTargetGroup
  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasCertificate
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates: [{CertificateArn: !Ref CertificateArn}]
      DefaultActions: [{Type: forward, TargetGroupArn: !Ref WebTargetGroup}]
  # API traffic goes straight to the API tasks (nginx is only needed for the static UI here).
  HttpApiRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Condition: NoCertificate
    Properties:
      ListenerArn: !Ref HttpListener
      Priority: 10
      Conditions: [{Field: path-pattern, Values: ["/api/*", "/health/*"]}]
      Actions: [{Type: forward, TargetGroupArn: !Ref ApiTargetGroup}]
  HttpsApiRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Condition: HasCertificate
    Properties:
      ListenerArn: !Ref HttpsListener
      Priority: 10
      Conditions: [{Field: path-pattern, Values: ["/api/*", "/health/*"]}]
      Actions: [{Type: forward, TargetGroupArn: !Ref ApiTargetGroup}]

  # ------------------------------------------------------------------ ECS
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${ProjectName}-cluster"
      ClusterSettings: [{Name: containerInsights, Value: enabled}]
  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties: {LogGroupName: !Sub "/ecs/${ProjectName}/api", RetentionInDays: !Ref LogRetentionDays}
  WebLogGroup:
    Type: AWS::Logs::LogGroup
    Properties: {LogGroupName: !Sub "/ecs/${ProjectName}/web", RetentionInDays: !Ref LogRetentionDays}

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement: [{Effect: Allow, Principal: {Service: ecs-tasks.amazonaws.com}, Action: "sts:AssumeRole"}]
      ManagedPolicyArns: ["arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy"]
      Policies:
        - PolicyName: read-own-secrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: "secretsmanager:GetSecretValue"
                Resource:
                  - !Ref AppSecret
                  - !GetAtt Database.MasterUserSecret.SecretArn
                  - !If [HasAdminEmail, !Ref AdminSecret, !Ref "AWS::NoValue"]
  ApiTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement: [{Effect: Allow, Principal: {Service: ecs-tasks.amazonaws.com}, Action: "sts:AssumeRole"}]
      Policies:
        - PolicyName: mount-own-file-system
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ["elasticfilesystem:ClientMount", "elasticfilesystem:ClientWrite"]
                Resource: !GetAtt FileSystem.Arn
                Condition:
                  StringEquals: {"elasticfilesystem:AccessPointArn": !GetAtt AccessPoint.Arn}

  ApiTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${ProjectName}-api"
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "1024"
      Memory: "4096"
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt ApiTaskRole.Arn
      Volumes:
        - Name: appdata
          EFSVolumeConfiguration:
            FilesystemId: !Ref FileSystem
            TransitEncryption: ENABLED
            AuthorizationConfig: {AccessPointId: !Ref AccessPoint, IAM: ENABLED}
      ContainerDefinitions:
        - Name: api
          Image: !Ref BackendImage
          Essential: true
          PortMappings: [{ContainerPort: 8000, Protocol: tcp}]
          MountPoints: [{SourceVolume: appdata, ContainerPath: /data, ReadOnly: false}]
          Environment:
            - {Name: ENERGIQ_ENV, Value: prod}
            - {Name: ENERGIQ_TRUST_PROXY, Value: "true"}
            - {Name: ENERGIQ_TRUSTED_PROXY_HOPS, Value: "1"}
            - Name: ENERGIQ_CORS_ORIGINS
              Value: !If
                - HasCertificate
                - !Sub '["https://${LoadBalancer.DNSName}"]'
                - !Sub '["http://${LoadBalancer.DNSName}"]'
            - {Name: ENERGIQ_ADMIN_EMAIL, Value: !Ref AdminEmail}
            - {Name: DB_HOST, Value: !GetAtt Database.Endpoint.Address}
            - {Name: DB_PORT, Value: !GetAtt Database.Endpoint.Port}
            - {Name: DB_NAME, Value: energiq}
          Secrets:
            - {Name: ENERGIQ_SECRET_KEY, ValueFrom: !Sub "${AppSecret}:secret_key::"}
            - {Name: DB_USER, ValueFrom: !Sub "${Database.MasterUserSecret.SecretArn}:username::"}
            - {Name: DB_PASSWORD, ValueFrom: !Sub "${Database.MasterUserSecret.SecretArn}:password::"}
            - !If
              - HasAdminEmail
              - {Name: ENERGIQ_ADMIN_PASSWORD, ValueFrom: !Sub "${AdminSecret}:password::"}
              - !Ref "AWS::NoValue"
          LogConfiguration:
            LogDriver: awslogs
            Options: {awslogs-group: !Ref ApiLogGroup, awslogs-region: !Ref "AWS::Region", awslogs-stream-prefix: api}
  WebTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${ProjectName}-web"
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "256"
      Memory: "512"
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      ContainerDefinitions:
        - Name: web
          Image: !Ref WebImage
          Essential: true
          PortMappings: [{ContainerPort: 8080, Protocol: tcp}]
          LogConfiguration:
            LogDriver: awslogs
            Options: {awslogs-group: !Ref WebLogGroup, awslogs-region: !Ref "AWS::Region", awslogs-stream-prefix: web}

  ApiService:
    Type: AWS::ECS::Service
    DependsOn: [MountTargetA, MountTargetB, HttpListener]
    Properties:
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      PlatformVersion: LATEST
      # Exactly one API task: the rate limiter and background job runner keep state in-process (see docs/13_limitations.md).
      DesiredCount: 1
      DeploymentConfiguration: {MinimumHealthyPercent: 0, MaximumPercent: 100}
      HealthCheckGracePeriodSeconds: 120
      TaskDefinition: !Ref ApiTaskDefinition
      LoadBalancers: [{ContainerName: api, ContainerPort: 8000, TargetGroupArn: !Ref ApiTargetGroup}]
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED # public subnet without NAT; the security group still only admits the load balancer
          Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
          SecurityGroups: [!Ref ApiSecurityGroup]
  WebService:
    Type: AWS::ECS::Service
    DependsOn: HttpListener
    Properties:
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      DesiredCount: 2
      TaskDefinition: !Ref WebTaskDefinition
      LoadBalancers: [{ContainerName: web, ContainerPort: 8080, TargetGroupArn: !Ref WebTargetGroup}]
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
          SecurityGroups: [!Ref WebSecurityGroup]

  # ------------------------------------------------------------------ alarms
  AlarmTopic:
    Type: AWS::SNS::Topic
  AlarmSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlarmEmail
    Properties: {TopicArn: !Ref AlarmTopic, Protocol: email, Endpoint: !Ref AlarmEmail}
  Api5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The API returned 5xx responses in two consecutive 5-minute periods
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_Target_5XX_Count
      Dimensions:
        - {Name: LoadBalancer, Value: !GetAtt LoadBalancer.LoadBalancerFullName}
        - {Name: TargetGroup, Value: !GetAtt ApiTargetGroup.TargetGroupFullName}
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
  ApiUnhealthyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: No healthy API task behind the load balancer
      Namespace: AWS/ApplicationELB
      MetricName: HealthyHostCount
      Dimensions:
        - {Name: LoadBalancer, Value: !GetAtt LoadBalancer.LoadBalancerFullName}
        - {Name: TargetGroup, Value: !GetAtt ApiTargetGroup.TargetGroupFullName}
      Statistic: Minimum
      Period: 60
      EvaluationPeriods: 3
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref AlarmTopic]
  DbCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Database CPU above 80% for 15 minutes
      Namespace: AWS/RDS
      MetricName: CPUUtilization
      Dimensions: [{Name: DBInstanceIdentifier, Value: !Ref Database}]
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      AlarmActions: [!Ref AlarmTopic]
  DbStorageAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Less than 2 GiB of free database storage
      Namespace: AWS/RDS
      MetricName: FreeStorageSpace
      Dimensions: [{Name: DBInstanceIdentifier, Value: !Ref Database}]
      Statistic: Minimum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 2147483648
      ComparisonOperator: LessThanThreshold
      AlarmActions: [!Ref AlarmTopic]

Outputs:
  ApplicationUrl:
    Description: Where the application is reachable once the stack is up (HTTPS only if a certificate was supplied)
    Value: !If [HasCertificate, !Sub "https://${LoadBalancer.DNSName}", !Sub "http://${LoadBalancer.DNSName}"]
  DatabaseEndpoint:
    Value: !GetAtt Database.Endpoint.Address
  AdminPasswordSecretArn:
    Condition: HasAdminEmail
    Description: Read the generated bootstrap administrator password from this secret, log in, then change it
    Value: !Ref AdminSecret
